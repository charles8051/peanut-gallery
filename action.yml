name: 'Peanut Gallery'
description: 'Persona-driven, multi-model pull request review with stateful per-persona sessions.'
author: 'Charles Lee'
branding:
  icon: 'eye'
  color: 'orange'

inputs:
  pr-number:
    description: 'Pull request number to review.'
    required: false
    # An issue_comment payload has no top-level `pull_request`, so the first half is empty
    # on the very trigger that lets you talk back to the panel - the default resolved to ""
    # and the run died on `--pr must be a number`. github.event.issue.number covers both
    # comment triggers. It is an ISSUE number when the comment is on a plain issue; the
    # action detects that from the payload and skips clean rather than fetching it as a PR
    # (issue #37). Consumers no longer need to pass this at all.
    default: ${{ github.event.pull_request.number || github.event.issue.number }}
  config:
    description: 'Path to a peanut config file in the repo. Empty = use the bundled default panel.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the PR diff and post comments (needs pull-requests: write).'
    required: false
    default: ${{ github.token }}
  openrouter-api-key:
    description: 'OpenRouter API key. Maps to OPENROUTER_API_KEY.'
    required: false
    default: ''
  fireworks-api-key:
    description: 'Fireworks API key. Maps to FIREWORKS_API_KEY.'
    required: false
    default: ''
  provider-keys:
    description: |
      Generic provider API keys, one KEY=VALUE per line, exported into the environment
      before the review runs. Satisfies any provider's apiKeyEnv without a dedicated
      input (e.g. a line "NVIDIA_API_KEY=..." fed from a repo secret; see the README).
      Blank lines and #comments are ignored. openrouter-api-key / fireworks-api-key still work.
    required: false
    default: ''

runs:
  using: 'docker'
  # Prebuilt image pushed by .github/workflows/image.yml on every main merge (moving
  # :main tag). Consumers (and this repo's own dogfood) docker pull it instead of
  # building the Dockerfile per job. A stock ubuntu-latest runner can pull it as long as
  # the GHCR package is public; while it is private, consumers must supply a runner that
  # is already docker-login'd to GHCR.
  #
  # :main is a MOVING tag, and this is why a consumer pinning `uses:` to a release SHA
  # still does not get pinned bytes: the pin fixes THIS FILE, and this file names a tag
  # that moves under it.
  #
  # Fixing that needs a reference to an image that ALREADY EXISTS at the moment this
  # file is committed - which rules out naming the release's own version. The commit
  # that gets tagged vX.Y.Z cannot name :vX.Y.Z, because that image is built by the tag
  # push, after the commit is written. Naming it earlier points at nothing.
  #
  # image.yml already pushes `:<git-sha>` for every main commit, so the reference that
  # does exist in time is the PREVIOUS commit's image. Use its DIGEST rather than the SHA
  # tag: a tag can be re-pushed by re-running image.yml for that commit, a digest cannot.
  #
  #   1. commit A lands on main   -> image.yml pushes :<shaA>
  #   2. commit B sets the line below to shaA's image DIGEST, and changes nothing else
  #   3. tag vX.Y.Z on commit B
  #
  # Commit B then names an image that exists, is immutable, and is the build of the code
  # one commit behind it - which is the same code, since B only edited this file.
  #
  # publish.yml also publishes :vX.Y.Z on a tag push. That is a readable alias for
  # humans tracing an image back to a release; it is NOT what makes the pin hold, and
  # nothing resolves through it.
  #
  # Note what changes when step 2 first lands: autoreview.yml uses `uses: ./`, so it
  # resolves through this same line. This repo's own PRs would be reviewed by the image
  # named here rather than by the latest main build - steadier, and slower to adopt its
  # own improvements. A deliberate trade, not a side effect to discover later.
  #
  # To rebuild from source instead, revert to 'Dockerfile'.
  # Built from commit 4f654d4, step 2 of the sequence above. Provenance, from the
  # metrics-report.yml procedure run on 2026-09-01:
  #   `docker buildx imagetools inspect :main` -> Digest sha256:85d5a0e6...,
  #   MediaType application/vnd.oci.image.index.v1+json
  #   package version 1189169859, created 2026-08-30T23:51:26Z
  #   tags ["4f654d424c2c4fcf64b9555c9411db757b043b8c", "main"]
  # Both tags on one version is the check: it is simultaneously what :main resolves to
  # and the build of 4f654d4, with no second candidate. That commit is "docs: the image
  # build is path-filtered, and its header said otherwise (#51)", the tip of main, with
  # build=success and test=success (test-fork and the hosted matrix skip by design on a
  # push).
  #
  # What this bump actually moves: nothing in the container. Between the previous pin's
  # build (970ac3d) and 4f654d4, `git diff -- src action Dockerfile action.yml` touches
  # only action.yml, which the runtime stage does not copy. The three intervening commits
  # are docs and a workflow comment. The pin is bumped to keep the gap between it and
  # :main small enough to review, not to ship a behaviour change.
  #
  # The digest is the INDEX digest (application/vnd.oci.image.index.v1+json), not either
  # per-platform manifest under it. That is what `docker buildx imagetools inspect
  # <tag>` reports as `Digest:`, and what the previous pin used.
  image: 'docker://ghcr.io/charles8051/peanut-gallery@sha256:85d5a0e6c384234859d31c75cd77e25a0ed5599d980d606fb550af881d7a02aa'
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
    FIREWORKS_API_KEY: ${{ inputs.fireworks-api-key }}
    # Map kebab-case inputs to clean env names (auto INPUT_* keep dashes, which aren't valid shell vars).
    PG_PR_NUMBER: ${{ inputs.pr-number }}
    PG_PROVIDER_KEYS: ${{ inputs.provider-keys }}
    PG_CONFIG: ${{ inputs.config }}
