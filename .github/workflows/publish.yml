name: Release

# Tag-driven release: pushing a `v*.*.*` tag runs the tests and, on success, packs
# PeanutGallery as a dotnet tool and pushes it to nuget.org.
#
# Authentication is nuget.org Trusted Publishing: the job requests a short-lived OIDC
# token from GitHub and nuget.org validates it against a registered policy, so no API
# key is stored in this repository. The policy must name:
#   Repository Owner  charles8051
#   Repository        peanut-gallery
#   Workflow File     publish.yml        (filename only, no .github/workflows/ prefix)
#   Environment       nuget.org          (must already exist on the repo)
# Scope its glob to PeanutGallery*: a policy binds to a package OWNER, not a repo, so an
# unscoped one would let this workflow publish any package the account owns.
on:
  push:
    tags:
      - 'v*.*.*'
  # Dispatch is ALWAYS a dry run: it exercises the whole path - OIDC exchange, policy
  # match, environment, packing - and never pushes. A trusted-publishing policy has
  # four fields that must line up (owner, repo, workflow FILENAME, environment) and a
  # wrong one fails at the login step, so the first exercise of a new policy should
  # not have to be an irreversible publish; nuget.org cannot delete a version.
  #
  # There is deliberately no `dry_run: false` escape hatch. It would let a dispatch
  # publish from whatever ref the UI happened to have selected - MinVer would derive
  # a version from a branch rather than a v*.*.* tag, and push it permanently. One
  # release mechanism, and it is the tag.
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PeanutGallery.slnx

      - name: Build
        run: dotnet build PeanutGallery.slnx --configuration Release --no-restore

      - name: Test
        shell: bash
        run: >
          dotnet test PeanutGallery.slnx --configuration Release --no-build
          --logger "trx;LogFileName=test-${{ matrix.os }}.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/test-*.trx"
          if-no-files-found: error
          retention-days: 30

  # A release produces two artifacts, and this is the second: an image tagged with the
  # version, so `action.yml` can name a fixed image instead of the moving `:main`.
  #
  # Lives here rather than in image.yml because the trigger is unambiguous. image.yml
  # filters on `paths:`, and how a path filter interacts with a tag push is not
  # something to guess at when the consequence is a release with no image.
  image:
    needs: test
    # Tag pushes only. On a workflow_dispatch `github.ref_name` is the branch, so
    # without this a dry run would build main and push it as `:main` - overwriting the
    # tag the action currently resolves through, from a job whose whole purpose is to
    # publish nothing.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.ref_name on a tag push is the tag itself, so v0.1.0 -> :v0.1.0. The
      # commit tag is pushed too: it is what lets a digest be traced back to a commit.
      - name: Build and push the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write   # required for nuget.org to issue the short-lived key
    steps:
      - uses: actions/checkout@v6
        with:
          # MinVer derives the version from the tag being built; a shallow checkout
          # fetches none and would publish 0.0.0-dev.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PeanutGallery.slnx

      - name: Pack
        # Only src/PeanutGallery.Cli is packable (PackAsTool=true).
        run: dotnet pack src/PeanutGallery.Cli/PeanutGallery.Cli.csproj --configuration Release -o packages

      - name: List packages
        run: ls -lh packages/

      # Requested immediately before the push: the key expires after one hour.
      - name: NuGet login
        id: login
        # Pinned to a commit, not the moving v1 tag: this step runs with
        # id-token: write and mints the credential that publishes the package, so a
        # compromised tag would let an attacker push PeanutGallery* to nuget.org.
        # Update deliberately, reading the diff between the two commits.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Gated on the EVENT, not on an input. The only push trigger is `tags: v*.*.*`,
      # so this runs for a release tag and for nothing else - a dispatch cannot reach
      # it whatever the UI had selected.
      - name: Push to nuget.org
        if: ${{ github.event_name == 'push' }}
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Dry run complete
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Dry run. The OIDC exchange with nuget.org succeeded, which means the"
          echo "trusted-publishing policy matched on owner, repository, workflow"
          echo "filename and environment. The packages below were built. Nothing was"
          echo "pushed - a dispatch never publishes. Push a v*.*.* tag to release."
          ls -lh packages/
