name: 'Peanut Gallery'
description: 'Persona-driven, multi-model pull request review with stateful per-persona sessions.'
author: 'Charles Lee'
branding:
  icon: 'eye'
  color: 'orange'

inputs:
  pr-number:
    description: 'Pull request number to review.'
    required: false
    default: ${{ github.event.pull_request.number }}
  config:
    description: 'Path to a peanut config file in the repo. Empty = use the bundled default panel.'
    required: false
    default: ''
  github-token:
    description: 'Token used to read the PR diff and post comments (needs pull-requests: write).'
    required: false
    default: ${{ github.token }}
  openrouter-api-key:
    description: 'OpenRouter API key. Maps to OPENROUTER_API_KEY.'
    required: false
    default: ''
  fireworks-api-key:
    description: 'Fireworks API key. Maps to FIREWORKS_API_KEY.'
    required: false
    default: ''
  provider-keys:
    description: |
      Generic provider API keys, one KEY=VALUE per line, exported into the environment
      before the review runs. Satisfies any provider's apiKeyEnv without a dedicated
      input (e.g. a line "NVIDIA_API_KEY=..." fed from a repo secret; see the README).
      Blank lines and #comments are ignored. openrouter-api-key / fireworks-api-key still work.
    required: false
    default: ''

runs:
  using: 'docker'
  # Prebuilt image pushed by .github/workflows/image.yml on every main merge (moving
  # :main tag). Consumers (and this repo's own dogfood) docker pull it instead of
  # building the Dockerfile per job. A stock ubuntu-latest runner can pull it as long as
  # the GHCR package is public; while it is private, consumers must supply a runner that
  # is already docker-login'd to GHCR.
  #
  # :main is a MOVING tag, and this is the reason a consumer pinning `uses:` to a
  # release SHA still does not get pinned bytes: the pin fixes THIS FILE, and this file
  # names a tag that moves under it.
  #
  # Releases now also publish `:vX.Y.Z` (see publish.yml's image job), so the fix is to
  # point this at a version instead. It cannot be done in the same change that adds the
  # job: this file is read at whatever commit a consumer pinned, so naming a version
  # before that version's image exists breaks every run in between. The order is
  #   1. ship the release-image job          <- done
  #   2. cut a release, which builds :vX.Y.Z
  #   3. point this line at :vX.Y.Z
  # and from then on the version bump here is part of preparing a release, before the
  # tag rather than after it.
  #
  # Note what changes when that lands: `uses: ./` in autoreview.yml resolves through
  # this same line, so this repo's own PRs would be reviewed by the last RELEASED
  # reviewer rather than the last merged one. Steadier, and slower to adopt its own
  # improvements. That is a deliberate trade, not a side effect to discover later.
  #
  # To rebuild from source instead, revert to 'Dockerfile'.
  image: 'docker://ghcr.io/charles8051/peanut-gallery:main'
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
    FIREWORKS_API_KEY: ${{ inputs.fireworks-api-key }}
    # Map kebab-case inputs to clean env names (auto INPUT_* keep dashes, which aren't valid shell vars).
    PG_PR_NUMBER: ${{ inputs.pr-number }}
    PG_PROVIDER_KEYS: ${{ inputs.provider-keys }}
    PG_CONFIG: ${{ inputs.config }}
