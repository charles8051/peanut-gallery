name: Peanut Gallery Review

# Dogfood: Peanut Gallery reviews its own pull requests through its own Docker
# container action (uses: ./). Runs on push to a PR AND on new PR comments, so the
# reviewers can respond to the author (e.g. withdraw a finding called out as
# intentional). Stateful across both; the bot-author guard below prevents a loop.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # 'created' only. An EDIT to an existing comment used to buy a whole extra panel turn: a new
  # comment defeats the unchanged-skip, so every persona re-runs (and re-verifies) against a diff
  # that did not move. Fixing a typo in a review reply is not worth a full panel.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

# cancel-in-progress: false (issue #32) — serialize runs in the group instead of killing
# the older one. Killing it recorded a CANCELLED conclusion that turned the check rollup
# UNSTABLE even though the review posted fine. With false, a push-vs-comment collision
# queues (A completes, then B runs) — both green, and the serialization keeps the
# persona-comment writes single-writer. A genuinely stale run (head moved on) early-exits
# green inside the action (Supersession), so it doesn't need cancelling either.
concurrency:
  group: peanut-gallery-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Efficiency filter only: skip our own bot comment events so they don't spawn no-op
    # jobs. SECURITY (fork refusal + comment-author trust) is enforced inside the action.
    #
    # Both clauses are AVAILABILITY, not correctness. Since v0.1.1 the action reads the
    # comment's subject from the payload and skips a non-PR comment on its own, so
    # dropping issue.pull_request here would no longer turn a comment on a tracking issue
    # red. It would still be wrong: the action can only skip AFTER a runner has taken the
    # job and pulled the container, and this repo is public with a self-hosted runner, so
    # anyone who can open an issue could start unbounded no-op jobs on it. Eligibility has
    # to be decided at this boundary because that is the only place the cost is still
    # unpaid. The action's own check stays as defence in depth.
    #
    # Fork gate (pull_request only). `uses: ./` builds this repo's Dockerfile from
    # the checked-out ref, so on a fork PR that is the FORK's Dockerfile, built and
    # run on the self-hosted runner. Commands.cs:694 already refuses a fork PR, but it
    # refuses from inside the container - by then the fork's build has already executed.
    # This moves the refusal ahead of it.
    #
    # No hosted twin, unlike build.yml's test-fork job: a fork pull_request gets no
    # secrets, so OPENROUTER_API_KEY is empty and there is no review to run. A
    # skipped job reports neutral, so nothing hangs waiting on it.
    #
    # Availability and hygiene, not a security boundary: a pull_request run uses
    # the fork's copy of this workflow and can edit the condition away. The
    # boundary is "Require approval for all outside collaborators" under
    # Settings -> Actions. That setting is only available once the repository is public,
    # and enabling it is a prerequisite of going public rather than a follow-up.
    #
    # issue_comment needs no fork gate: that event checks out the BASE repo, so the
    # Dockerfile built is always this repo's.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event.comment.user.type != 'Bot' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15   # backstop: kill a wedged review instead of holding the runner for hours
    steps:
      - uses: actions/checkout@v6
      - name: Peanut Gallery
        uses: ./
        with:
          config: peanut.json
          # pr-number is action.yml's default now - it carries the same
          # `pull_request.number || issue.number` fallback this line used to spell out.
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
