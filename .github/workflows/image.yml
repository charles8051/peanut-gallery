name: Build Image

# Builds the Peanut Gallery container-action image and pushes it to GHCR under a MOVING
# `:main` tag, plus an immutable `:<sha>` for pinning. Path-filtered (see `on:` below):
# a push to main that touches only docs does not rebuild, so `:main` can sit behind main.
#
# action.yml pins an image DIGEST rather than naming `:main`, so a build here does not
# reach consumers until that pin is bumped in its own commit. Either way they pull a
# prebuilt image instead of building the Dockerfile per review job.
#
# The package is PUBLIC, so a consumer pull needs no authentication. The login step below
# is for the PUSH out of this workflow, which needs `packages: write` either way.
#
# Buildkit registry cache (`:buildcache`) persists the SDK restore/publish layers in
# GHCR, so a source-only change reuses the cached restore (paired with the split
# restore layer in the Dockerfile).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'action/**'
      - 'Dockerfile'
      - 'action.yml'
      - 'PeanutGallery.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/charles8051/peanut-gallery

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
